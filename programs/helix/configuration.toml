# Helix Configuration

# Keybindings from Neovim

[keybindings]

# General Insert Mode
"<C-b>" = "beginning of line"
"<C-e>" = "end of line"

# Navigate within Insert Mode
"<C-h>" = "move left"
"<C-l>" = "move right"
"<C-j>" = "move down"
"<C-k>" = "move up"

# Normal Mode
"<Esc>" = "clear highlights"
"<C-h>" = "window left"
"<C-l>" = "window right"
"<C-j>" = "window down"
"<C-k>" = "window up"
"<C-s>" = "save file"

# Copy All
"<C-c>" = "copy whole file"

# Toggle Line Number
"<leader>n" = "toggle line number"
"<leader>rn" = "toggle relative number"

# New Buffer
"<leader>b" = "new buffer"

